version: '3.8'

services:
  bot:
    build:
      target: development
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
      - /app/telegramNinjaBot/__pycache__
      - /app/telegramNinjaBot/handlers/__pycache__
      - /app/telegramNinjaBot/services/__pycache__
    environment:
      - API_URL=http://server:8000
      - ENVIRONMENT=development
    env_file:
      - ./backend/telegramNinjaBot/.env.dev
    restart: "no"

  server:
    build:
      context: ./backend/API server
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/API server:/app
      - /app/__pycache__
    environment:
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    env_file:
      - ./backend/API server/.env
    command: [
        "sh", "-c",
        "echo 'Waiting for PostgreSQL...' && python wait-for-postgres.py && \
         echo 'Applying Alembic migrations...' && alembic upgrade head && \
         echo 'Starting Uvicorn...' && uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"
    ]
    restart: unless-stopped
    depends_on:
      - postgres

  scheduler:
    build:
      context: ./backend/scheduler
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/scheduler:/app
      - /app/__pycache__
    environment:
      - API_URL=http://nginx:80
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: unless-stopped
    ports:
      - "8002:8002"

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # - REACT_APP_WS_URL=ws://localhost/socket.io
      - REACT_APP_WS_URL=ws://localhost:8001
      - REACT_APP_ENV=development
      - REACT_APP_DEBUG=true
    env_file:
      - ./frontend/.env.docker
    command: ./node_modules/.bin/craco start
    restart: unless-stopped
    ports:
      - "3000:3000"

  websocket:
    ports:
      - "8001:8001"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: ["sh", "-c", "uvicorn src.server:socket_app --host 0.0.0.0 --port 8001"]
    depends_on:
      - postgres

  nginx:
    volumes:
      - ./websocket-service/nginx.conf.dev:/etc/nginx/nginx.conf:ro
      - ./websocket-service/test_client.html:/var/www/appninjabot/websocket-service/index.html:ro
    ports:
      - "80:80"
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.conf.dev
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx 