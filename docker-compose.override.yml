services:
  # Основной бот для авторизации
  bot-main:
    build:
      target: development
      context: ./backend/telegramNinjaBot
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
    environment:
      - API_URL=http://server:8000
      - PUBLIC_API_URL=http://localhost:8000
      - ENVIRONMENT=development
      - USE_POLLING=true
      - PYTHONDONTWRITEBYTECODE=1
      - SCHEDULER_API_URL=http://scheduler:8002
      - LOCAL_DEV=true
      - LOCAL_FRONTEND_PORT=3000
      - BOT_TYPE=main
      - BOT_TOKEN=8012479473:AAHHMhUpZb2XD_08Plv_o5mr_YUMbMLYhUw
      - AUTH_BOT_USERNAME=Flouix_bot
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qkfUdU9T7hjJm-VelFLI
      - USE_DATABASE=true
    ports:
      - "8003:8003"
    networks:
      - ninja_network
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]

  # Контейнер для всех ботов компаний (динамически загружает все активные боты из БД)
  bot-companies:
    build:
      target: development
      context: ./backend/telegramNinjaBot
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
    environment:
      - API_URL=http://server:8000
      - PUBLIC_API_URL=http://localhost:8000
      - ENVIRONMENT=development
      - USE_POLLING=true
      - PYTHONDONTWRITEBYTECODE=1
      - SCHEDULER_API_URL=http://scheduler:8002
      - LOCAL_DEV=true
      - LOCAL_FRONTEND_PORT=3000
      - BOT_TYPE=companies
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qkfUdU9T7hjJm-VelFLI
      - USE_DATABASE=true
    ports:
      - "8004:8003"
    networks:
      - ninja_network
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]

  # Старый сервис bot для обратной совместимости (можно удалить после миграции)
  bot:
    build:
      target: development
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
    environment:
      - API_URL=http://server:8000
      - PUBLIC_API_URL=http://localhost:8000
      - ENVIRONMENT=development
      - USE_POLLING=true
      - PYTHONDONTWRITEBYTECODE=1
      - SCHEDULER_API_URL=http://scheduler:8002
      - LOCAL_DEV=true
      - LOCAL_FRONTEND_PORT=3000
    ports:
      - "8003:8003"
    restart: unless-stopped
    profiles:
      - legacy

  server:
    build:
      context: ./backend/API server
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/API server:/app
      - shared-data:/app/shared
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - ENVIRONMENT=development
      - ENV=development
      - PYTHONPATH=/app
      - BOT_API_URL=http://bot:8003
      - TELEGRAM_BOT_TOKEN=8012479473:AAHHMhUpZb2XD_08Plv_o5mr_YUMbMLYhUw
      - TELEGRAM_CHAT_ID=6843570748
      - GOOGLE_APPLICATION_CREDENTIALS=/app/shared/appninjabotcontent-330206f13743.json
    env_file:
      - ./backend/API server/.env
    command: ["bash", "-c", "/usr/local/bin/python wait-for-postgres.py && /bin/echo 'Applying Alembic migrations...' && /usr/local/bin/alembic upgrade head && /bin/echo 'Starting Gunicorn with 4 workers...' && gunicorn main:app -b 0.0.0.0:8000 --workers 4 --timeout 120 -k uvicorn.workers.UvicornWorker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started

  scheduler:
    build:
      context: ./backend/scheduler
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend/scheduler:/app
      - ./backend/shared:/app/shared
    env_file:
      - ./backend/scheduler/.env_scheduler
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - API_URL=http://server:8000
      - BOT_URL=http://bot-companies:8003
      - BOT_API_URL=http://bot-companies:8003
      - HEALTHCHECK_BOT_URL=http://bot-companies:8003/health
      - ENVIRONMENT=development
      - PYTHONPATH=/app:/app/shared
      - POSTGRES_HOST=postgres
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    restart: unless-stopped
    ports:
      - "8002:8002"

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_WS_URL=ws://localhost:8001
      - VITE_API_URL=http://localhost:8000/api
      - VITE_ENV=development
      - VITE_DEBUG=true
    env_file:
      - ./frontend/.env.docker
    command: npm run dev
    restart: unless-stopped
    ports:
      - "3000:3000"

  websocket:
    ports:
      - "8001:8001"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: ["sh", "-c", "gunicorn src.asgi:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001 --workers 2"]
    depends_on:
      - postgres

  landing:
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api