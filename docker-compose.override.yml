version: '3.8'

services:
  bot:
    build:
      target: development
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
      - /app/telegramNinjaBot/__pycache__
      - /app/telegramNinjaBot/handlers/__pycache__
      - /app/telegramNinjaBot/services/__pycache__
    environment:
      - API_URL=http://server:8000
      - ENVIRONMENT=development
    env_file:
      - ./backend/telegramNinjaBot/.env.dev
    restart: "no"

  server:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data/inventory:/app/data/inventory
      - /app/__pycache__
      - /app/*/__pycache__
    environment:
      - API_BASE_URL=http://server:8000/api
      - SOCKET_URL=ws://websocket:8001
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - ENVIRONMENT=development
    restart: unless-stopped

  scheduler:
    build:
      target: development
    volumes:
      - ./backend/scheduler:/app/scheduler
      - ./backend/data:/app/data
      - /app/__pycache__
      - /app/*/__pycache__
    environment:
      - API_URL=http://nginx:80
      - ENVIRONMENT=development

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=http://localhost/api
      - REACT_APP_WS_URL=ws://localhost/socket.io
      - REACT_APP_ENV=development
      - REACT_APP_DEBUG=true
    env_file:
      - ./frontend/.env.docker
    command: ./node_modules/.bin/craco start
    restart: unless-stopped
    ports:
      - "3000:3000"

  websocket:
    volumes:
      - ./websocket-service:/app
      - /app/__pycache__
      - /app/*/__pycache__
    ports:
      - "8001:8001"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://localhost:80
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    command: uvicorn src.asgi:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - postgres

  nginx:
    volumes:
      - ./websocket-service/nginx.conf.dev:/etc/nginx/nginx.conf:ro
      - ./websocket-service/test_client.html:/var/www/appninjabot/websocket-service/index.html:ro
    ports:
      - "80:80"
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.conf.dev
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx 