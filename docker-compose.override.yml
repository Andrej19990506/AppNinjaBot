services:
  bot:
    build:
      target: development
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
    environment:
      - API_URL=http://server:8000
      - ENVIRONMENT=development
      - USE_POLLING=true
      - PYTHONDONTWRITEBYTECODE=1
      - SCHEDULER_API_URL=http://scheduler:8002
    env_file:
      - ./backend/telegramNinjaBot/.env.dev
    ports:
      - "8003:8003"
    restart: unless-stopped

  server:
    build:
      context: ./backend/API server
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/API server:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - BOT_API_URL=http://bot:8003
    env_file:
      - ./backend/API server/.env
    command: ["bash", "-c", "/usr/local/bin/python wait-for-postgres.py && /bin/echo 'Applying Alembic migrations...' && /usr/local/bin/alembic upgrade head && /bin/echo 'Starting Uvicorn...' && /usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started

  scheduler:
    build:
      context: ./backend/scheduler
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend/scheduler:/app
      - ./backend/shared:/app/shared
    env_file:
      - ./backend/scheduler/.env_scheduler
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - API_URL=http://server:8000
      - BOT_URL=http://bot:8003
      - ENVIRONMENT=development
      - PYTHONPATH=/app:/app/shared
      - POSTGRES_HOST=postgres
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    restart: unless-stopped
    ports:
      - "8002:8002"

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_WS_URL=ws://localhost:8001
      - REACT_APP_ENV=development
      - REACT_APP_DEBUG=true
    env_file:
      - ./frontend/.env.docker
    command: ./node_modules/.bin/craco start
    restart: unless-stopped
    ports:
      - "3000:3000"

  websocket:
    ports:
      - "8001:8001"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: ["sh", "-c", "uvicorn src.server:socket_app --host 0.0.0.0 --port 8001"]
    depends_on:
      - postgres 