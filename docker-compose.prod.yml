version: '3.8'

services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
      target: production
    environment:
      - API_URL=https://c8e767f0-ac37-4f85-88bd-7ce8bceb888c.selcdn.net
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - BOT_PORT=8003
      - SCHEDULER_API_URL=http://scheduler:8002
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/telegramNinjaBot/.env.prod
    command: python -u /app/telegramNinjaBot/main.py
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  server:
    build:
      target: production
    expose:
      - 8000
    volumes:
      - shared-data:/app/shared
    command: gunicorn main:app -b 0.0.0.0:8000 --workers 8 --timeout 120 -k uvicorn.workers.UvicornWorker
    environment:
      - API_BASE_URL=https://c8e767f0-ac37-4f85-88bd-7ce8bceb888c.selcdn.net/api
      - BOT_URL=http://bot:8003
      - SCHEDULER_URL=http://scheduler:8002
      - WEBSOCKET_SERVER_URL=http://websocket:8001
      - SOCKET_URL=wss://appninjabot.ru
      - DOMAIN=c8e767f0-ac37-4f85-88bd-7ce8bceb888c.selcdn.net
      - ALLOWED_ORIGINS=*
      - TRUST_PROXY=true
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=your_super_secret_key_here
      - RETAILIQA_API_BASE_URL=https://ninjapizza.retailiqa.ru/api/v2/
      - RETAILIQA_TOKEN=7e20cab58a5d4b06b6a55424f0127731
      - RETAILIQA_API_TIMEOUT=15
      - TELEGRAM_BOT_TOKEN=8012479473:AAHHMhUpZb2XD_08Plv_o5mr_YUMbMLYhUw
      - TELEGRAM_CHAT_ID=6843570748
      - GOOGLE_APPLICATION_CREDENTIALS=/app/shared/appninjabotcontent-330206f13743.json
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_started
      postgres:
        condition: service_healthy
      cache:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  scheduler:
    build:
      context: ./backend/scheduler
      dockerfile: Dockerfile
      target: production
    environment:
      - API_URL=http://nginx:80
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qkfUdU9T7hjJm-VelFLI
      - BOT_API_URL=http://bot:8003
      - BOT_INTERNAL_URL=http://bot:8003
      - HEALTHCHECK_API_URL=https://c8e767f0-ac37-4f85-88bd-7ce8bceb888c.selcdn.net/api/health
      - HEALTHCHECK_BOT_URL=https://c8e767f0-ac37-4f85-88bd-7ce8bceb888c.selcdn.net/api/bot/health
      - HEALTHCHECK_BOT_SEND_MESSAGE_URL=http://bot:8003/send_message/health
      - CLOUDINARY_CLOUD_NAME=dzymrkr14
      - CLOUDINARY_API_KEY=729531884973171
      - CLOUDINARY_API_SECRET=D8f3KJs53yr2D36mmxy6pEM9DuQ
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  websocket:
    command: gunicorn src.asgi:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001 --workers 2
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PORT=8001
      - HOST=0.0.0.0
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ninja_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.nginx
      args:
        NGINX_CONFIG: nginx.conf.prod.template
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_logs:/var/log/nginx
      - shared-data:/app/shared
    environment:
      - REACT_APP_API_URL=${VITE_APP_API_URL:-https://c8e767f0-ac37-4f85-88bd-7ce8bceb888c.selcdn.net}
      - VITE_WS_URL=${VITE_APP_WS_URL:-wss://appninjabot.ru/socket.io/}
      - ENV_TYPE=${ENV_TYPE:-production}
      - REACT_APP_DEBUG=${VITE_DEBUG:-false}
      - WEBHOOK_PATH=${WEBHOOK_PATH:-/api/telegram/wh_k8s3j9aLp7qWzXyB}
      - NGINX_HOST=appninjabot.ru
      - NGINX_PORT=80
    command: /bin/sh -c "envsubst '\$${WEBHOOK_PATH} \$${NGINX_HOST} \$${NGINX_PORT}' < /etc/nginx/nginx.conf.prod.template > /etc/nginx/nginx.conf && /docker-entrypoint.d/50-generate-config-js.sh && nginx -g 'daemon off;'"
    depends_on:
      - server
      - websocket
    restart: unless-stopped
    networks:
      - ninja_network
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    ports: []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  cache:
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===== МОНИТОРИНГ =====
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - ninja_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-monitoring.appninjabot.ru}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-monitoring.appninjabot.ru}
    networks:
      - ninja_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  node-exporter:
    image: prom/node-exporter:latest
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - ninja_network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports: []
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - ninja_network
    restart: unless-stopped

networks:
  ninja_network:
    driver: bridge 

volumes:
  shared-data:
  prometheus_data:
  grafana_data: