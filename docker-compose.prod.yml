version: '3.8'

services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
      target: production
    environment:
      - API_URL=https://appninjabot.ru
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - BOT_PORT=8003
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/telegramNinjaBot/.env.prod
    command: python -u /app/telegramNinjaBot/main.py
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  server:
    build:
      target: production
    expose:
      - 8000
    command: gunicorn main:app -b 0.0.0.0:8000 --workers 4 --timeout 120 -k uvicorn.workers.UvicornWorker
    environment:
      - API_BASE_URL=https://appninjabot.ru/api
      - BOT_URL=http://bot:8003
      - SCHEDULER_URL=http://scheduler:8002
      - WEBSOCKET_SERVER_URL=http://websocket:8001
      - SOCKET_URL=wss://appninjabot.ru
      - DOMAIN=appninjabot.ru
      - ALLOWED_ORIGINS=*
      - TRUST_PROXY=true
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=your_super_secret_key_here
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  scheduler:
    build:
      context: ./backend
      dockerfile: ./scheduler/Dockerfile
      target: production
    environment:
      - API_URL=http://nginx:80
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  websocket:
    command: gunicorn src.asgi:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001 --workers 1
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PORT=8001
      - HOST=0.0.0.0
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ninja_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./websocket-service/nginx.conf.prod.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx_logs:/var/log/nginx
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-https://appninjabot.ru}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL:-wss://appninjabot.ru/ws/v1}
      - ENV_TYPE=${ENV_TYPE:-production}
      - REACT_APP_DEBUG=${REACT_APP_DEBUG:-false}
      - WEBHOOK_PATH=${WEBHOOK_PATH:-/api/telegram/wh_k8s3j9aLp7qWzXyB}
      - NGINX_HOST=appninjabot.ru
      - NGINX_PORT=80
    command: /bin/sh -c "envsubst '\$${WEBHOOK_PATH} \$${NGINX_HOST} \$${NGINX_PORT}' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - server
      - websocket
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  ninja_network:
    driver: bridge 