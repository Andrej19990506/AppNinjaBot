version: '3.8'

services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
      target: production
    environment:
      - API_URL=https://appninjabot.ru
      - ENVIRONMENT=production
      - PYTHONPATH=/app
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/telegramNinjaBot/.env.prod
    command: python -u /app/telegramNinjaBot/main.py
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  server:
    build:
      target: production
    expose:
      - 8000
    command: gunicorn main:app -b 0.0.0.0:8000 --workers 4 --timeout 120 -k uvicorn.workers.UvicornWorker
    environment:
      - API_BASE_URL=https://appninjabot.ru/api
      - BOT_URL=http://bot:8001
      - SCHEDULER_URL=http://scheduler:8002
      - WEBSOCKET_SERVER_URL=http://websocket:8003
      - SOCKET_URL=wss://appninjabot.ru
      - DOMAIN=appninjabot.ru
      - ALLOWED_ORIGINS=*
      - TRUST_PROXY=true
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=your_super_secret_key_here
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  scheduler:
    environment:
      - API_URL=http://nginx:80
      - API_BASE_URL=https://appninjabot.ru/api
      - BOT_URL=http://bot:8001
      - SCHEDULER_URL=http://scheduler:8002
      - WEBSOCKET_SERVER_URL=http://websocket:8003
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=your_super_secret_key_here
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      target: production
    expose:
      - 80
    volumes: []
    environment:
      - REACT_APP_API_URL=https://appninjabot.ru/api
      - REACT_APP_WS_URL=wss://appninjabot.ru
      - NODE_ENV=production
      - REACT_APP_ENV=production
      - REACT_APP_DEBUG=false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]

  websocket:
    command: gunicorn src.asgi:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8001 --workers 4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    volumes:
      - ./websocket-service/nginx.conf.prod:/etc/nginx/nginx.conf:ro
      - ./websocket-service/test_client.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M 