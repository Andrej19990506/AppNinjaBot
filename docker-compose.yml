version: '3'

services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
      target: development
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
      - /app/telegramNinjaBot/__pycache__
      - /app/telegramNinjaBot/handlers/__pycache__
      - /app/telegramNinjaBot/services/__pycache__
      - shared-data:/app/shared
    env_file:
      - ./backend/telegramNinjaBot/.env
    restart: "no"
    deploy:
      replicas: 1
      restart_policy:
        condition: none
    networks:
      - ninja_network
    command: python -u -m telegramNinjaBot.bot

  server:
    build: 
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/*/__pycache__
      - ./backend/data/inventory:/app/data/inventory
      - shared-data:/app/shared
    env_file:
      - ./backend/.env
      - ./backend/telegramNinjaBot/.env
    depends_on:
      - bot
    networks:
      - ninja_network
    command: python app.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=https://sense-gpl-announced-battle.trycloudflare.com

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=https://sense-gpl-announced-battle.trycloudflare.com/api
      - REACT_APP_DEBUG=true
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - server
    networks:
      - ninja_network
    command: npm start

  tunnel-frontend:
    image: cloudflare/cloudflared
    command: tunnel --url http://frontend:3000 --no-autoupdate --protocol http2 --heartbeat-interval 10s --retries 10 --grace-period 30s --metrics 0.0.0.0:20000
    networks:
      - ninja_network
    depends_on:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  tunnel-api:
    image: cloudflare/cloudflared
    command: tunnel --url http://server:8000 --no-autoupdate --protocol http2 --heartbeat-interval 10s --retries 10 --grace-period 30s --metrics 0.0.0.0:20001
    networks:
      - ninja_network
    depends_on:
      - server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  bot-data:
  shared-data:

networks:
  ninja_network:
    driver: bridge 