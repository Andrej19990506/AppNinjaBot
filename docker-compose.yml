version: '3.8'

services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
    volumes:
      - shared-data:/app/shared
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    networks:
      - ninja_network
    command: python -u /app/telegramNinjaBot/bot.py

  server:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/.env
      - ./backend/telegramNinjaBot/.env
    depends_on:
      - bot
    networks:
      - ninja_network
    command: python app.py
    environment:
      - PYTHONUNBUFFERED=1

  scheduler:
    build:
      context: ./backend
    volumes:
      - shared-data:/app/shared
    depends_on:
      - server
    networks:
      - ninja_network
    command: python scheduler/app.py
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      target: ${NODE_ENV:-development}
    expose:
      - 3000
    env_file:
      - ./frontend/.env${NODE_ENV:+.production}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - server
      - websocket
    networks:
      - ninja_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  websocket:
    build:
      context: ./websocket-service
    expose:
      - "8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - HOST=0.0.0.0
      - PYTHONPATH=/app
    depends_on:
      - postgres
    networks:
      - ninja_network

  nginx:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./websocket-service/nginx.conf.prod:/etc/nginx/nginx.conf
      - ./websocket-service/test_client.html:/var/www/appninjabot/websocket-service/index.html
    depends_on:
      - frontend
      - server
      - websocket
    restart: unless-stopped
    networks:
      - ninja_network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ninja_network
    command: postgres -c 'max_connections=1000'

volumes:
  shared-data:
  postgres-data:

networks:
  ninja_network:
    driver: bridge 