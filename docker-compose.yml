version: '3.8'

services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/telegramNinjaBot/.env.dev
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ninja_network
    command: python -u -m telegramNinjaBot.bot

  server:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/.env
      - ./backend/telegramNinjaBot/.env
    depends_on:
      - bot
    networks:
      - ninja_network
    command: python app.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

  scheduler:
    build:
      context: ./backend
    volumes:
      - shared-data:/app/shared
    depends_on:
      - server
    networks:
      - ninja_network
    command: python scheduler/app.py
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
    depends_on:
      - server
    networks:
      - ninja_network

  websocket:
    build:
      context: ./websocket-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - HOST=0.0.0.0
      - PYTHONPATH=/app
    depends_on:
      - postgres
    networks:
      - ninja_network

  nginx:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - server
      - websocket
    restart: unless-stopped
    networks:
      - ninja_network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ninja_network
    command: postgres -c 'max_connections=1000'

volumes:
  shared-data:
  postgres-data:

networks:
  ninja_network:
    driver: bridge 