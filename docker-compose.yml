version: '3.8'

services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
      target: development
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
      - /app/telegramNinjaBot/__pycache__
      - /app/telegramNinjaBot/handlers/__pycache__
      - /app/telegramNinjaBot/services/__pycache__
      - shared-data:/app/shared
    env_file:
      - ./backend/telegramNinjaBot/.env
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=https://ourselves-suzuki-ft-phantom.trycloudflare.com
    restart: "no"
    deploy:
      replicas: 1
      restart_policy:
        condition: none
    networks:
      - ninja_network
    command: python -u -m telegramNinjaBot.bot

  server:
    build: 
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data/inventory:/app/data/inventory
      - shared-data:/app/shared
    env_file:
      - ./backend/.env
      - ./backend/telegramNinjaBot/.env
    depends_on:
      - bot
    networks:
      - ninja_network
    command: python app.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=https://ourselves-suzuki-ft-phantom.trycloudflare.com
      - SOCKET_URL=wss://ourselves-suzuki-ft-phantom.trycloudflare.com/ws
      - PYTHONPYCACHEPREFIX=/tmp/pycache

  scheduler:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/*/__pycache__
      - ./backend/data/inventory:/app/data/inventory
      - shared-data:/app/shared
    depends_on:
      - server
    networks:
      - ninja_network
    command: python scheduler/app.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://server:8000/api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=https://ourselves-suzuki-ft-phantom.trycloudflare.com/api
      - REACT_APP_WS_URL=wss://ourselves-suzuki-ft-phantom.trycloudflare.com
      - NODE_ENV=${NODE_ENV:-development}
      - REACT_APP_ENV=${NODE_ENV:-development}
      - REACT_APP_DEBUG=true
      - PORT=${PORT:-3000}
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - server
    networks:
      - ninja_network
    command: ./node_modules/.bin/craco start

  tunnel-frontend:
    image: cloudflare/cloudflared
    command: tunnel --url http://frontend:${PORT:-3000} --no-autoupdate --protocol http2 --heartbeat-interval 10s --retries 10 --grace-period 30s --metrics 0.0.0.0:20000
    networks:
      - ninja_network
    depends_on:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  tunnel-api:
    image: cloudflare/cloudflared
    command: tunnel --url http://server:8000 --no-autoupdate --protocol http2 --heartbeat-interval 10s --retries 10 --grace-period 30s --metrics 0.0.0.0:20001 --http2-origin --no-tls-verify
    networks:
      - ninja_network
    depends_on:
      - server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  bot-data:
  shared-data:
  server-cache:

networks:
  ninja_network:
    driver: bridge 