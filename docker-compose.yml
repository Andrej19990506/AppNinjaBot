services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
    volumes:
      - shared-data:/app/shared
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - BOT_HOST=0.0.0.0
      - BOT_PORT=8003
    networks:
      - ninja_network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]

  server:
    build:
      context: ./backend/API server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/API server/.env
    depends_on:
        bot:
            condition: service_started
        postgres:
            condition: service_healthy
    networks:
      - ninja_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1

  scheduler:
    build:
      context: ./backend
      dockerfile: ./scheduler/Dockerfile
    expose:
      - "8002"
    volumes:
      - shared-data:/app/shared
    depends_on:
      - server
      - postgres
    networks:
      - ninja_network
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# Restore frontend service definition ONLY for building the image
  frontend:
    build:
      context: ./frontend
      target: production-build # Target the final build stage
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL} 
        REACT_APP_WS_URL: ${REACT_APP_WS_URL}   
    image: appninjabot-frontend-img:latest # Explicit image name
    # No command, ports, volumes, etc. - this service will not be run directly

  websocket:
    build:
      context: ./websocket-service
    expose:
      - "8001"
    volumes:
      - ./websocket-service/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - HOST=0.0.0.0
      - PYTHONPATH=/app
    depends_on:
        postgres:
            condition: service_healthy
    networks:
      - ninja_network
    command: uvicorn src.asgi:app --host 0.0.0.0 --port 8001

  nginx:
    build:
      context: .
      dockerfile: ./websocket-service/Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./websocket-service/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server
      - websocket
      - frontend # Keep dependency: nginx build depends on frontend image
    environment:
      REACT_APP_API_URL: ${API_URL:-https://appninjabot.ru/api}
      REACT_APP_WS_URL: ${WS_URL:-wss://appninjabot.ru}
      ENV_TYPE: ${NODE_ENV:-production}
      REACT_APP_DEBUG: ${REACT_APP_DEBUG:-false}
      API_URL: ${API_URL:-https://appninjabot.ru/api}
      WS_URL: ${WS_URL:-wss://appninjabot.ru}
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    networks:
      - ninja_network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ninja_network
    command: postgres -c 'max_connections=1000'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appninjabot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  shared-data:
  postgres-data:

networks:
  ninja_network:
    driver: bridge 