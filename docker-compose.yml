services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
    volumes:
      - shared-data:/app/shared
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qkfUdU9T7hjJm-VelFLI
      - BOT_HOST=0.0.0.0
      - BOT_PORT=8003
    networks:
      - ninja_network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]

  server:
    build:
      context: ./backend/API server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - shared-data:/app/shared
    env_file:
      - ./backend/API server/.env
    depends_on:
        bot:
            condition: service_started
        postgres:
            condition: service_healthy
    networks:
      - ninja_network
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - GOOGLE_APPLICATION_CREDENTIALS=/app/shared/appninjabotcontent-330206f13743.json

  scheduler:
    build:
      context: ./backend/scheduler
      dockerfile: Dockerfile
    expose:
      - "8002"
    volumes:
      - shared-data:/app/shared
    depends_on:
      - server
      - postgres
    networks:
      - ninja_network
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qkfUdU9T7hjJm-VelFLI
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# Restore frontend service definition ONLY for building the image
  frontend:
    build:
      context: ./frontend
      target: production-build 
      args:
        VITE_APP_API_URL: ${VITE_APP_API_URL} 
        VITE_APP_WS_URL: ${VITE_APP_WS_URL}   
    image: appninjabot-frontend-img:latest 
    

  websocket:
    build:
      context: ./websocket-service
    expose:
      - "8001"
    volumes:
      - ./websocket-service/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qkfUdU9T7hjJm-VelFLI
      - HOST=0.0.0.0
      - PYTHONPATH=/app
    depends_on:
        postgres:
            condition: service_healthy
    networks:
      - ninja_network
    command: uvicorn src.asgi:app --host 0.0.0.0 --port 8001

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server
      - websocket
      - frontend 
    environment:
      REACT_APP_API_URL: ${API_URL:-https://appninjabot.ru/api}
      REACT_APP_WS_URL: ${WS_URL:-wss://appninjabot.ru}
      ENV_TYPE: ${NODE_ENV:-production}
      REACT_APP_DEBUG: ${REACT_APP_DEBUG:-false}
      API_URL: ${API_URL:-https://appninjabot.ru/api}
      WS_URL: ${WS_URL:-wss://appninjabot.ru}
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    networks:
      - ninja_network

  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=appninjabot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qkfUdU9T7hjJm-VelFLI
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ninja_network
    command: postgres -c 'max_connections=1000'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appninjabot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer # Используем официальный образ Adminer
    restart: unless-stopped
    ports:
      - "8080:8080" # Открываем порт 8080 на хосте
    environment:
      # Предзаполняем сервер по умолчанию (имя сервиса postgres)
      - ADMINER_DEFAULT_SERVER=postgres 
      # Используем приятную тему оформления
      - ADMINER_DESIGN=flat 
    depends_on:
      - postgres # Запускаем после postgres
    networks:
      - ninja_network # Подключаем к той же сети, что и postgres

  # ---> ДОБАВЛЕНО: Сервис DragonflyDB <---
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    volumes:
      - dragonfly_data:/data # Для сохранения данных (опционально)
    # Порт не публикуем наружу по умолчанию, доступ внутри сети Docker
    # ports:
    #  - "6379:6379" 
    networks:
      - ninja_network # Подключаем к нашей сети
    command: ["--logtostderr"] # Выводим логи в stderr для Docker
    ulimits: # Рекомендуемые лимиты
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
  # ---> КОНЕЦ ДОБАВЛЕНИЯ <---

  # ===== МОНИТОРИНГ =====
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    container_name: appninjabot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - ninja_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: appninjabot-grafana
    ports:
      - "3001:3000"  # Используем 3001 чтобы не конфликтовать с фронтендом
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - ninja_network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: appninjabot-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - ninja_network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: appninjabot-cadvisor
    ports:
      - "8081:8080" 
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - ninja_network
    restart: unless-stopped

volumes:
  shared-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./backend/shared
  postgres-data:
  dragonfly_data:
  prometheus_data:
  grafana_data:


networks:
  ninja_network:
    driver: bridge 