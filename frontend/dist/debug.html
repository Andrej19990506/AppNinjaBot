<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppNinjaBot Debug - Config.js Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status {
            padding: 10px 15px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 4px; overflow-x: auto; }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 4px; 
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .test-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 AppNinjaBot Debug Page</h1>
        <p>Эта страница поможет диагностировать проблемы с загрузкой config.js</p>
        
        <div id="status"></div>
        
        <div class="test-grid">
            <div class="test-card">
                <h3>📄 Config.js Status</h3>
                <div id="config-status">Проверяем...</div>
            </div>
            
            <div class="test-card">
                <h3>🌐 Network Info</h3>
                <div id="network-info">Загружаем...</div>
            </div>
            
            <div class="test-card">
                <h3>📱 Device Info</h3>
                <div id="device-info">Загружаем...</div>
            </div>
            
            <div class="test-card">
                <h3>🔄 Tests</h3>
                <button onclick="testDirectLoad()">Прямая загрузка config.js</button>
                <button onclick="testFetch()">Fetch API тест</button>
                <button onclick="testXHR()">XHR тест</button>
                <div id="test-results"></div>
            </div>
        </div>
        
        <div id="config-content">
            <h3>📋 Config Content</h3>
            <pre id="config-data">Загружаем конфигурацию...</pre>
        </div>
        
        <div id="logs">
            <h3>📝 Logs</h3>
            <pre id="log-output"></pre>
        </div>
    </div>

    <script>
        let logs = [];
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            logs.push(logEntry);
            console.log(logEntry);
            document.getElementById('log-output').textContent = logs.join('\n');
        }
        
        function updateStatus(message, type = 'info') {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        function displayNetworkInfo() {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const info = {
                userAgent: navigator.userAgent,
                online: navigator.onLine,
                language: navigator.language,
                platform: navigator.platform,
                connection: conn ? {
                    effectiveType: conn.effectiveType,
                    downlink: conn.downlink,
                    rtt: conn.rtt,
                    saveData: conn.saveData
                } : 'Not available'
            };
            document.getElementById('network-info').innerHTML = `<pre>${JSON.stringify(info, null, 2)}</pre>`;
            log(`Network info: ${JSON.stringify(info)}`);
        }
        
        function displayDeviceInfo() {
            const info = {
                screen: `${screen.width}x${screen.height}`,
                viewport: `${window.innerWidth}x${window.innerHeight}`,
                devicePixelRatio: window.devicePixelRatio,
                touchSupport: 'ontouchstart' in window,
                isMobile: /Mobi|Android/i.test(navigator.userAgent)
            };
            document.getElementById('device-info').innerHTML = `<pre>${JSON.stringify(info, null, 2)}</pre>`;
            log(`Device info: ${JSON.stringify(info)}`);
        }
        
        function checkConfigStatus() {
            if (window.APP_CONFIG) {
                updateStatus('✅ Config.js загружен успешно!', 'success');
                document.getElementById('config-status').innerHTML = `
                    <div class="status success">✅ Загружен</div>
                    <small>Время загрузки: ${window.configLoadEnd ? (window.configLoadEnd - window.configLoadStart) : 'N/A'}ms</small>
                `;
                document.getElementById('config-data').textContent = JSON.stringify(window.APP_CONFIG, null, 2);
                log('Config loaded successfully');
            } else {
                updateStatus('❌ Config.js НЕ загружен!', 'error');
                document.getElementById('config-status').innerHTML = '<div class="status error">❌ Не загружен</div>';
                document.getElementById('config-data').textContent = 'Config.js не найден';
                log('Config NOT loaded');
            }
        }
        
        function testDirectLoad() {
            log('Testing direct config.js load...');
            const script = document.createElement('script');
            script.src = '/config.js?t=' + Date.now();
            script.onload = () => {
                log('✅ Direct load success');
                checkConfigStatus();
            };
            script.onerror = (e) => {
                log('❌ Direct load failed: ' + e);
            };
            document.head.appendChild(script);
        }
        
        function testFetch() {
            log('Testing fetch API...');
            fetch('/config.js?t=' + Date.now())
                .then(response => {
                    log(`Fetch response: ${response.status} ${response.statusText}`);
                    log(`Headers: ${JSON.stringify([...response.headers])}`);
                    return response.text();
                })
                .then(text => {
                    log(`✅ Fetch success, content length: ${text.length}`);
                    document.getElementById('test-results').innerHTML += `<div class="status success">Fetch: OK (${text.length} bytes)</div>`;
                })
                .catch(err => {
                    log(`❌ Fetch failed: ${err}`);
                    document.getElementById('test-results').innerHTML += `<div class="status error">Fetch: Failed - ${err}</div>`;
                });
        }
        
        function testXHR() {
            log('Testing XMLHttpRequest...');
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/config.js?t=' + Date.now());
            xhr.onload = function() {
                log(`✅ XHR success: ${xhr.status} ${xhr.statusText}`);
                log(`Response length: ${xhr.responseText.length}`);
                document.getElementById('test-results').innerHTML += `<div class="status success">XHR: OK (${xhr.responseText.length} bytes)</div>`;
            };
            xhr.onerror = function() {
                log(`❌ XHR failed: ${xhr.status} ${xhr.statusText}`);
                document.getElementById('test-results').innerHTML += `<div class="status error">XHR: Failed</div>`;
            };
            xhr.send();
        }
        
        // Инициализация
        window.configLoadStart = Date.now();
        
        window.addEventListener('appConfigLoaded', function(event) {
            window.configLoadEnd = Date.now();
            log('✅ Config loaded via event');
            checkConfigStatus();
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM loaded, starting diagnostics...');
            displayNetworkInfo();
            displayDeviceInfo();
            
            // Проверяем config через некоторое время
            setTimeout(() => {
                checkConfigStatus();
            }, 1000);
        });
    </script>
    
    <!-- Загружаем config.js -->
    <script src="/config.js"></script>
</body>
</html>
