<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Test - AppNinjaBot</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f0f0f0;
        }
        .success { 
            background: #d4edda; 
            color: #155724; 
            padding: 15px; 
            border-radius: 5px; 
            margin: 10px 0;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460; 
            padding: 15px; 
            border-radius: 5px;
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>📱 Mobile Test Page</h1>
    
    <div class="success">
        ✅ Если ты видишь эту страницу - базовая связность работает!
    </div>
    
    <div class="info">
        <strong>URL этой страницы:</strong><br>
        https://appninjabot.ru/mobile-test.html
    </div>
    
    <h3>🔍 Диагностические тесты:</h3>
    
    <button onclick="testConfigJs()">Тест config.js</button>
    <button onclick="testMainApp()">Тест главной страницы</button>
    <button onclick="testDebugPage()">Тест debug.html</button>
    <button onclick="showNetworkInfo()">Информация о сети</button>
    
    <div id="results"></div>
    
    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.style.padding = '10px';
            div.style.margin = '5px 0';
            div.style.borderRadius = '5px';
            
            if (type === 'success') {
                div.style.background = '#d4edda';
                div.style.color = '#155724';
            } else if (type === 'error') {
                div.style.background = '#f8d7da';
                div.style.color = '#721c24';
            } else {
                div.style.background = '#d1ecf1';
                div.style.color = '#0c5460';
            }
            
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        function testConfigJs() {
            addResult('🔄 Тестирую config.js...');
            
            fetch('/config.js')
                .then(response => {
                    if (response.ok) {
                        addResult(`✅ config.js доступен (статус: ${response.status})`, 'success');
                        return response.text();
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                })
                .then(content => {
                    addResult(`📄 Размер: ${content.length} байт`, 'info');
                    if (content.includes('APP_CONFIG')) {
                        addResult('✅ Содержимое корректное', 'success');
                    } else {
                        addResult('❌ Содержимое некорректное', 'error');
                    }
                })
                .catch(error => {
                    addResult(`❌ Ошибка загрузки config.js: ${error.message}`, 'error');
                });
        }
        
        function testMainApp() {
            addResult('🔄 Тестирую главную страницу...');
            
            fetch('/')
                .then(response => {
                    if (response.ok) {
                        addResult(`✅ Главная страница доступна (статус: ${response.status})`, 'success');
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                })
                .catch(error => {
                    addResult(`❌ Ошибка загрузки главной страницы: ${error.message}`, 'error');
                });
        }
        
        function testDebugPage() {
            addResult('🔄 Тестирую debug.html...');
            
            fetch('/debug.html')
                .then(response => {
                    if (response.ok) {
                        addResult(`✅ debug.html доступен (статус: ${response.status})`, 'success');
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                })
                .catch(error => {
                    addResult(`❌ Ошибка загрузки debug.html: ${error.message}`, 'error');
                });
        }
        
        function showNetworkInfo() {
            addResult('📱 Информация об устройстве и сети:');
            
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                online: navigator.onLine,
                screen: `${screen.width}x${screen.height}`,
                viewport: `${window.innerWidth}x${window.innerHeight}`,
                timestamp: new Date().toISOString()
            };
            
            if (navigator.connection) {
                info.connection = {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt,
                    saveData: navigator.connection.saveData
                };
            }
            
            addResult(`<pre>${JSON.stringify(info, null, 2)}</pre>`, 'info');
        }
        
        // Автоматически показываем информацию при загрузке
        window.addEventListener('load', function() {
            addResult('🎉 Страница успешно загружена!', 'success');
            showNetworkInfo();
        });
    </script>
</body>
</html>
