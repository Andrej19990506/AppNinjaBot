apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: appninjabot-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: API_BASE_URL
          value: "http://server-service:8000"
        - name: SOCKET_URL
          value: "ws://server-service:8000/ws"
        - name: PYTHONPYCACHEPREFIX
          value: "/tmp/pycache" 