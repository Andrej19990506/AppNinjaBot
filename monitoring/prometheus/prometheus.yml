global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus сам себя мониторит
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Server метрики
  - job_name: 'api-server'
    static_configs:
      - targets: ['server:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # WebSocket Service метрики
  - job_name: 'websocket-service'
    static_configs:
      - targets: ['websocket:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter - системные метрики
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # cAdvisor - Docker контейнеры метрики
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']  # Внутренний порт остается 8080
    scrape_interval: 15s

  # Redis и PostgreSQL метрики отключены - нужны специальные экспортеры
  # Для Redis: redis_exporter
  # Для PostgreSQL: postgres_exporter
