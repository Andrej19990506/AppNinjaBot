services:
  bot:
    build: 
      context: ./backend/telegramNinjaBot
      target: development
    volumes:
      - ./backend/telegramNinjaBot:/app/telegramNinjaBot
      - ./backend/telegramNinjaBot/data:/app/telegramNinjaBot/data
      - /app/telegramNinjaBot/__pycache__
      - /app/telegramNinjaBot/handlers/__pycache__
      - /app/telegramNinjaBot/services/__pycache__
      - shared-data:/app/shared
    env_file:
      - ./backend/telegramNinjaBot/.env
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=${API_TUNNEL_URL:-http://server:8000}
    restart: "no"
    deploy:
      replicas: 1
      restart_policy:
        condition: none
    networks:
      - ninja_network
    command: python -u -m telegramNinjaBot.bot
    depends_on:
      - tunnel-api

  server:
    build: 
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data/inventory:/app/data/inventory
      - shared-data:/app/shared
    env_file:
      - ./backend/.env
      - ./backend/telegramNinjaBot/.env
    depends_on:
      - tunnel-api
    networks:
      - ninja_network
    command: python app.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=${API_TUNNEL_URL:-http://server:8000}
      - SOCKET_URL=${API_TUNNEL_URL_WS:-ws://server:8000/ws}
      - PYTHONPYCACHEPREFIX=/tmp/pycache

  scheduler:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/*/__pycache__
      - ./backend/data/inventory:/app/data/inventory
      - shared-data:/app/shared
    depends_on:
      - server
    networks:
      - ninja_network
    command: python scheduler/app.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=${API_TUNNEL_URL:-http://server:8000}/api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=${API_TUNNEL_URL:-http://server:8000}/api
      - REACT_APP_WS_URL=${API_TUNNEL_URL_WS:-ws://server:8000}
      - NODE_ENV=${NODE_ENV:-development}
      - REACT_APP_ENV=${NODE_ENV:-development}
      - REACT_APP_DEBUG=true
      - PORT=${PORT:-3000}
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - server
    networks:
      - ninja_network
    command: ./node_modules/.bin/craco start

  tunnel-frontend:
    build:
      context: .
      dockerfile: dockerfile-localtunnel
    container_name: tunnel-frontend
    restart: unless-stopped
    command: --port ${PORT:-3000} --local-host frontend
    networks:
      - ninja_network
    depends_on:
      - frontend

  tunnel-api:
    build:
      context: .
      dockerfile: dockerfile-localtunnel
    container_name: tunnel-api
    restart: unless-stopped
    command: --port 8000 --local-host server
    networks:
      - ninja_network
    depends_on:
      - server

volumes:
  bot-data:
  shared-data:
  server-cache:

networks:
  ninja_network:
    driver: bridge 