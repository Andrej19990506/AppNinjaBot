events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Основные настройки
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Настройки буферов и таймаутов
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 1k;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    # Основной сервер
    server {
        listen 80;
        server_name localhost;

        # Логи
        access_log /var/log/nginx/access.log combined;
        error_log /var/log/nginx/error.log;

        # Тестовый клиент
        location = /test_client.html {
            root /usr/share/nginx/html;
            add_header Content-Type text/html;
            add_header Cache-Control "no-cache";
        }

        # WebSocket endpoint
        location /socket.io/ {
            proxy_pass http://websocket:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # HTTP polling specific
            proxy_buffering off;
            proxy_cache off;
            
            # WebSocket specific
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            # Socket.IO specific
            proxy_buffers 8 32k;
            proxy_buffer_size 64k;
        }

        # Frontend app
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Для статических файлов и API запросов
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|html|woff|woff2|ttf|svg|eot)$ {
                expires max;
                log_not_found off;
            }
        }

        # API without trailing slash
        location /api {
            rewrite ^/api$ /api/ permanent;
            rewrite ^/api([^/])(.*)$ /api/$1$2 permanent;
        }

        # API
        location /api/ {
            proxy_pass http://server:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Заголовки для правильной работы API
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        }
    }
} 