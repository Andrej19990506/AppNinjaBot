<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Room Monitor</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .room-info {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
        }
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 300px;
            background-color: #555;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #555 transparent transparent transparent;
        }
        .tooltip.show .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #2196f3;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #1976d2;
        }
        .user-item {
            padding: 5px;
            margin: 2px 0;
            border-radius: 3px;
            background-color: #e0e0e0;
        }
        .courier-user {
            background-color: #bbdefb;
            border-left: 4px solid #2196f3;
        }
        #messages {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            background-color: white;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
        }
        .system { background-color: #e8f5e9; color: #2e7d32; }
        .error { background-color: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <h2>Монитор комнат WebSocket</h2>
    
    <div class="room-info">
        <h3>Глобальная комната</h3>
        <div class="tooltip">
            <button onclick="checkGlobalRoom()">Просмотр участников</button>
            <div class="tooltiptext" id="globalRoomInfo">
                <div id="globalRoomUsers">Нет данных</div>
            </div>
        </div>
    </div>

    <div class="room-info">
        <h3>Комната курьеров</h3>
        <input type="text" id="chatIdInput" placeholder="ID чата">
        <div class="tooltip">
            <button onclick="checkCourierRoom()">Просмотр участников</button>
            <div class="tooltiptext" id="courierRoomInfo">
                <div id="courierRoomUsers">Нет данных</div>
            </div>
        </div>
    </div>

    <div id="messages"></div>

    <script>
        let socket = null;
        const messagesDiv = document.getElementById('messages');
        const globalRoomUsers = document.getElementById('globalRoomUsers');
        const courierRoomUsers = document.getElementById('courierRoomUsers');
        const chatIdInput = document.getElementById('chatIdInput');

        function addMessage(message, type = 'system') {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            messageElement.textContent = message;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function initSocket() {
            if (!socket) {
                socket = io({
                    transports: ['polling', 'websocket'],
                    path: '/socket.io/',
                    autoConnect: true,
                    reconnection: true,
                    reconnectionDelay: 1000,
                    timeout: 20000
                });

                socket.on('connect', () => {
                    addMessage('Подключено к серверу');
                });

                socket.on('disconnect', () => {
                    addMessage('Отключено от сервера');
                });

                socket.on('room_users', (data) => {
                    addMessage(`Получен список пользователей комнаты: ${JSON.stringify(data)}`);
                    if (data.room === 'global') {
                        updateGlobalRoomUsers(data.users);
                    } else if (data.room.startsWith('courier_room_')) {
                        updateCourierRoomUsers(data.users);
                    }
                });

                socket.on('error', (error) => {
                    addMessage('Ошибка: ' + error, 'error');
                });
                
                socket.on('users_list', (data) => {
                    addMessage(`Получен общий список пользователей: ${JSON.stringify(data)}`);
                    if (data.room === 'global') {
                        updateGlobalRoomUsers(data.users);
                    } else if (data.room.startsWith('courier_room_')) {
                        updateCourierRoomUsers(data.users);
                    }
                });
                
                socket.on('user_joined', (data) => {
                    addMessage(`Пользователь присоединился: ${JSON.stringify(data)}`);
                });
                
                socket.on('room_users_update', (data) => {
                    addMessage(`Обновление списка пользователей: ${JSON.stringify(data)}`);
                    if (data.room === 'global') {
                        updateGlobalRoomUsers(data.users);
                    } else if (data.room.startsWith('courier_room_')) {
                        updateCourierRoomUsers(data.users);
                    }
                });
            }
        }

        function updateGlobalRoomUsers(users) {
            globalRoomUsers.innerHTML = '';
            if (users && users.length > 0) {
                const header = document.createElement('div');
                header.textContent = `Пользователей в комнате: ${users.length}`;
                globalRoomUsers.appendChild(header);
                
                users.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.className = 'user-item';
                    // Расширяем проверку имени пользователя для различных форматов
                    const userName = user.name || user.first_name || user.sid || 'Неизвестно';
                    userElement.textContent = userName;
                    userElement.title = JSON.stringify(user); // Добавляем подсказку с полными данными для отладки
                    globalRoomUsers.appendChild(userElement);
                });
            } else {
                globalRoomUsers.textContent = 'Нет пользователей в комнате';
            }
            document.querySelector('.tooltip').classList.add('show');
            setTimeout(() => {
                document.querySelector('.tooltip').classList.remove('show');
            }, 5000);
        }

        function updateCourierRoomUsers(users) {
            courierRoomUsers.innerHTML = '';
            if (users && users.length > 0) {
                const header = document.createElement('div');
                header.textContent = `Пользователей в комнате: ${users.length}`;
                courierRoomUsers.appendChild(header);
                
                users.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.className = 'user-item';
                    if (user.role === 'senior_courier' || user.is_senior_courier) {
                        userElement.className += ' courier-user';
                    }
                    userElement.textContent = `${user.name || user.sid} (${user.role || 'неизвестно'})`;
                    courierRoomUsers.appendChild(userElement);
                });
            } else {
                courierRoomUsers.textContent = 'Нет пользователей в комнате';
            }
            document.querySelectorAll('.tooltip')[1].classList.add('show');
            setTimeout(() => {
                document.querySelectorAll('.tooltip')[1].classList.remove('show');
            }, 5000);
        }

        function checkGlobalRoom() {
            initSocket();
            socket.emit('get_room_users', { room: 'global' });
            addMessage('Запрос информации о глобальной комнате');
        }

        function checkCourierRoom() {
            const chatId = chatIdInput.value.trim();
            if (!chatId) {
                addMessage('Введите ID чата', 'error');
                return;
            }
            
            initSocket();
            socket.emit('get_room_users', { room: `courier_room_${chatId}` });
            addMessage(`Запрос информации о комнате курьеров ${chatId}`);
        }

        // Отключаемся при закрытии страницы
        window.onbeforeunload = function() {
            if (socket) {
                socket.disconnect();
            }
        };
    </script>
</body>
</html>
